      required: true
      example:
        type: 1
        data:
          msgId: "message_id"
          uidFrom: "sender_zalo_id"
          content: "Bật đèn phòng khách"
        threadId: "group_or_user_thread_id"
        isSelf: false
        _accountId: "bot_zalo_account_id"
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: conversational_assistant
